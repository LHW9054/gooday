spring.application.name=gooday
server.port=8100

# DB (없으면 자동 생성). 비밀번호가 다르면 환경변수 DB_USERNAME / DB_PASSWORD 로 덮어쓰기
spring.datasource.url=jdbc:mysql://localhost:3306/gooday_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 스키마는 schema.sql 이 관리 (JPA 는 테이블을 건드리지 않음)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# SQL 로그를 보고 싶으면 true
spring.jpa.show-sql=false

spring.jackson.time-zone=Asia/Seoul

# 비밀번호 등은 Git 에 올리지 않는 로컬 파일에서 읽음 (application-local.properties.example 참고)
spring.config.import=optional:classpath:application-local.properties
